project:
  type: website
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "talks/**/*.qmd"
execute:
  freeze: auto
website:
  title: "Hersh Gupta"
  description: "Responsible AI, Generative AI, and applied science"
  google-analytics: "G-GXXLWF1R58"
  cookie-consent: false
  favicon: static/favicon.ico
  open-graph: true
  twitter-card: true
  navbar:
    pinned: true
    title: false
    left:
      - text: "Home"
        href: "index.qmd"
      - text: "Writing"
        href: "writing.qmd"
      - text: "Projects"
        href: "projects.qmd"
      - text: "Talks"
        href: "talks/index.qmd"
      - text: "About"
        href: "about.qmd"
    right:
      - icon: envelope
        aria-label: email
        href: "mailto:h(dot)v(dot)gupta@outlook.com"
      - text: "{{< fa brands bluesky >}}"
        aria-label: bluesky
        href: https://bsky.app/profile/hershgupta.com
      - icon: github
        aria-label: github
        href: https://github.com/hersh-gupta
      - icon: linkedin
        aria-label: linkedin
        href: https://www.linkedin.com/in/hershvgupta
  search:
    location: navbar
    type: overlay
  page-footer:
    center: |
      Made with [Quarto](https://quarto.org/) · [Source on GitHub](https://github.com/hersh-gupta/website)
format:
  html:
    theme:
      - cosmo
      - custom.scss
editor: source
author-meta: "Hersh Gupta"
