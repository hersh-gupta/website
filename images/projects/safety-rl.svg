<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Training pipeline: Qwen3.5-0.8B base model, SFT warm start, then GRPO with a composite reward or DPO on PKU-SafeRLHF, then evaluation</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6A7063"/>
    </marker>
    <style>
      .box{fill:#F7F5EF;stroke:#DAD9CC;stroke-width:2}
      .key{fill:#F7F5EF;stroke:#56705A;stroke-width:3}
      .input{fill:#DCE5D3;stroke:#8FA68E;stroke-width:2}
      .n{font-family:Georgia,'Times New Roman',serif;font-size:28px;fill:#1E211C;text-anchor:middle}
      .s{font-family:Consolas,'Courier New',monospace;font-size:17px;fill:#4B5047;text-anchor:middle}
      .lbl{font-family:Consolas,'Courier New',monospace;font-size:18px;letter-spacing:3px;fill:#6A7063}
      .ln{stroke:#6A7063;stroke-width:2.5;fill:none}
    </style>
  </defs>
  <rect width="800" height="600" fill="#ECEDE3"/>
  <text class="lbl" x="24" y="46">SAFETY RL</text>

  <!-- inputs -->
  <rect class="input" x="370" y="40" width="210" height="88" rx="5"/>
  <text class="n" x="475" y="80">Reward</text>
  <text class="s" x="475" y="108">safe + helpful</text>

  <rect class="input" x="370" y="472" width="210" height="88" rx="5"/>
  <text class="n" x="475" y="512">Preferences</text>
  <text class="s" x="475" y="540">PKU-SafeRLHF</text>

  <!-- main flow -->
  <rect class="box" x="20" y="256" width="160" height="88" rx="5"/>
  <text class="n" x="100" y="296">Base</text>
  <text class="s" x="100" y="324">Qwen3.5-0.8B</text>

  <rect class="box" x="214" y="256" width="122" height="88" rx="5"/>
  <text class="n" x="275" y="308">SFT</text>

  <rect class="key" x="370" y="168" width="210" height="88" rx="5"/>
  <text class="n" x="475" y="221">GRPO</text>

  <rect class="box" x="370" y="344" width="210" height="88" rx="5"/>
  <text class="n" x="475" y="397">DPO</text>

  <rect class="box" x="614" y="256" width="166" height="88" rx="5"/>
  <text class="n" x="697" y="308">Evaluate</text>

  <!-- arrows -->
  <path class="ln" d="M180 300 H209" marker-end="url(#a)"/>
  <path class="ln" d="M336 285 L366 236" marker-end="url(#a)"/>
  <path class="ln" d="M336 315 L366 364" marker-end="url(#a)"/>
  <path class="ln" d="M475 128 V163" marker-end="url(#a)"/>
  <path class="ln" d="M475 472 V437" marker-end="url(#a)"/>
  <path class="ln" d="M580 236 L610 285" marker-end="url(#a)"/>
  <path class="ln" d="M580 364 L610 315" marker-end="url(#a)"/>
</svg>
